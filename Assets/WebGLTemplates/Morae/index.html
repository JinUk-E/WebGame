<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- 모바일 브라우저 대응 (2026-08-05): 확대·축소 차단. viewport-fit은 기본(auto) 유지 —
         cover로 두면 캔버스가 노치 밑으로 들어간다. 기본값이면 브라우저가 안전영역을 알아서 피한다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      /* architecture.md §8.4 — 16:9 고정 letterbox, 배경 검정, 스크롤 원천 차단 */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;          /* 당겨서 새로고침·바운스 차단 */
        touch-action: none;                 /* 스크롤·핀치줌·더블탭 확대 차단 (터치는 Unity로) */
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;        /* 길게 누르기 컨텍스트 메뉴 차단 */
      }
      #unity-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;                     /* 모바일 주소창 변동 대응 (미지원 브라우저는 위 100vh) */
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }
      /* 세로 화면에서도 16:9 letterbox 유지 — 게임 내 해상도 규칙(§3.4)에 엣지케이스를 만들지 않는다 */
      #unity-canvas {
        aspect-ratio: 16 / 9;
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        background: #000;
        outline: none;
        touch-action: none;
        display: block;
      }
      @supports (height: 100dvh) {
        #unity-canvas {
          width: min(100vw, calc(100dvh * 16 / 9));
          height: min(100dvh, calc(100vw * 9 / 16));
        }
      }
      #unity-loading-bar { position: absolute; }
      #unity-warning { position: absolute; top: 5%; }

      /* 세로 화면 안내 — 터치 기기에서만. 16:9 letterbox라 세로에서는 화면이 너무 작다 */
      #rotate-notice {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #000;
        color: #d8cfbc;
        font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif;
        text-align: center;
        padding: 24px;
        z-index: 10;
      }
      #rotate-notice .icon { font-size: 52px; }
      #rotate-notice .msg { font-size: 18px; line-height: 1.6; }
      #rotate-notice button {
        margin-top: 8px;
        padding: 10px 22px;
        font-size: 16px;
        color: #d8cfbc;
        background: #1a1a1c;
        border: 1px solid #3a3733;
        border-radius: 4px;
      }
      @media (orientation: portrait) and (pointer: coarse) and (hover: none) {
        body:not(.rotate-dismissed) #rotate-notice { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <div id="rotate-notice">
      <div class="icon">📱↻</div>
      <div class="msg">기기를 가로로 돌려주세요.<br>이어폰·헤드폰 착용을 권합니다.</div>
      <button type="button" id="rotate-dismiss">이대로 진행</button>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // ---- 모바일 제스처 차단 (touch-action만으로 안 막히는 것들) ----
      // 데스크톱 동작 유지를 위해 터치 기기에서만 건다 — 우클릭 메뉴·더블클릭은 데스크톱에 그대로 둔다
      var isTouchDevice = !!(window.matchMedia
        && window.matchMedia('(pointer: coarse)').matches
        && window.matchMedia('(hover: none)').matches);
      if (isTouchDevice) {
        document.addEventListener("touchmove", function (e) {
          if (e.touches.length > 1) e.preventDefault(); // 핀치 줌
        }, { passive: false });
        document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
        document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });
        document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      }
      document.getElementById("rotate-dismiss").addEventListener("click", function () {
        document.body.classList.add("rotate-dismissed");
      });

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };

      // §8.4 ② — devicePixelRatio 1 강제 (4K·레티나 GPU 비용 상한, 2D라 체감 손실 없음)
      config.devicePixelRatio = 1;

#if BACKGROUND_FILENAME
      canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif
      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
